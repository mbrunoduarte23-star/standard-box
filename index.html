<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockPro - Gerenciador de Estoque</title>
    <style>
        /* Seus estilos originais aqui - mantive iguais */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .login-form { max-width: 400px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; margin: 0 4px; }
        .btn-add { background: #28a745; color: white; }
        .btn-remove { background: #dc3545; color: white; } /* NOVO: Estilo para botão remover */
        .form-row { display: flex; gap: 10px; }
        .form-row input { flex: 1; }
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="login-form">
        <h2>Login no StockPro</h2>
        <input type="text" id="username" placeholder="Usuário" value="bruno">
        <input type="password" id="password" placeholder="Senha" value="1234">
        <button onclick="login()">Entrar</button>
        <p style="color: red; margin-top: 10px;" id="loginError"></p>
    </div>

    <!-- PAINEL PRINCIPAL (OCULTO INICIALMENTE) -->
    <div id="mainPanel" class="container hidden">
        <h1>StockPro - Catálogo de Produtos</h1>
        <button onclick="logout()" style="float: right; background: #6c757d;">Sair</button>

        <!-- FORMULÁRIO PARA ADICIONAR PRODUTO -->
        <div style="background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
            <h3>Adicionar Novo Produto</h3>
            <div class="form-row">
                <input type="text" id="nomeProd" placeholder="Nome do Produto">
                <input type="number" id="precoProd" placeholder="Preço (R$)" step="0.01">
                <input type="number" id="qtdProd" placeholder="Quantidade em Estoque">
            </div>
            <button onclick="addProduto()" class="btn btn-add">Adicionar Produto</button>
        </div>

        <!-- TABELA DE PRODUTOS -->
        <table id="tabelaProdutos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço (R$)</th>
                    <th>Estoque</th>
                    <th>Ações</th> <!-- NOVO: Coluna para ações -->
                </tr>
            </thead>
            <tbody id="listaProdutos">
                <!-- Produtos serão inseridos aqui via JS -->
            </tbody>
        </table>
    </div>

    <script>
        // ARMAZENAMENTO LOCAL PARA PRODUTOS (usa localStorage)
        let produtos = JSON.parse(localStorage.getItem('produtosStockPro')) || [];
        let usuarioLogado = false;

        // MUDANÇA 1: Login simples alterado para usuário "bruno" e senha "1234"
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('loginError');

            if (user === 'bruno' && pass === '1234') { // ALTERADO AQUI: nova credencial
                usuarioLogado = true;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                atualizarTabela(); // Carrega a tabela ao logar
                error.textContent = '';
            } else {
                error.textContent = 'Usuário ou senha incorretos!';
            }
        }

        function logout() {
            usuarioLogado = false;
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Adiciona produto
        function addProduto() {
            const nome = document.getElementById('nomeProd').value;
            const preco = parseFloat(document.getElementById('precoProd').value);
            const qtd = parseInt(document.getElementById('qtdProd').value);

            if (nome && !isNaN(preco) && !isNaN(qtd) && qtd > 0) {
                produtos.push({ nome, preco, qtd });
                localStorage.setItem('produtosStockPro', JSON.stringify(produtos));
                atualizarTabela();
                limparForm();
            } else {
                alert('Preencha todos os campos corretamente!');
            }
        }

        // NOVO: Função para remover produto por índice
        function removerProduto(index) {
            if (confirm(`Remover "${produtos[index].nome}"?`)) {
                produtos.splice(index, 1);
                localStorage.setItem('produtosStockPro', JSON.stringify(produtos));
                atualizarTabela();
            }
        }

        function atualizarTabela() {
            const tbody = document.getElementById('listaProdutos');
            tbody.innerHTML = '';
            produtos.forEach((prod, index) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${prod.nome}</td>
                    <td>${prod.preco.toFixed(2)}</td>
                    <td>${prod.qtd}</td>
                    <td>
                        <button onclick="removerProduto(${index})" class="btn btn-remove">Remover</button>
                    </td>
                `;
            });
        }

        function limparForm() {
            document.getElementById('nomeProd').value = '';
            document.getElementById('precoProd').value = '';
            document.getElementById('qtdProd').value = '';
        }

        // Permite Enter no login
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !usuarioLogado) {
                login();
            }
        });
    </script>
</body>
</html>
