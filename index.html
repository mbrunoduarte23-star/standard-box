<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StandardBox — Controle e gestão</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ===== TEMA BOX — CLARO (Branco/Azul/Cinza) ===== */
:root {
  --bg:        #f8f9ff;
  --bg2:       #e8eaff;
  --card:      #ffffff;
  --card2:     #f0f1ff;
  --border:    #d0d5e0;
  --text:      #1a1a2e;
  --text2:     #4a5568;
  --gold:      #3182ce;
  --gold2:     #4299e1;
  --danger:    #e05252;
  --success:   #3dbd7d;
  --warning:   #e8a838;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }
#app { max-width: 1400px; margin: 0 auto; padding: 20px; }
header { background: var(--card); border: 1px solid var(--border); padding: 18px 24px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--gold), var(--gold2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
nav { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-nav { padding: 9px 18px; background: var(--card2); color: var(--text2); border: 1px solid var(--border); border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
.btn-nav:hover { background: var(--gold); color: #000; border-color: var(--gold); transform: translateY(-1px); }
.btn-nav.active { background: var(--gold); color: #000; border-color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: all 0.2s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); border-color: #3a3a3a; }
.card h3 { color: var(--gold); margin-bottom: 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.stat { text-align: center; padding: 20px; background: var(--card2); border-radius: 12px; border: 1px solid var(--border); }
.stat-value { font-size: 30px; font-weight: 800; color: var(--gold); }
.stat-label { color: var(--text2); font-weight: 500; font-size: 13px; margin-top: 4px; }
.produto-item { display: flex; gap: 12px; padding: 12px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; align-items: center; }
.produto-item:hover { border-color: var(--gold); }
.produto-info { flex: 1; min-width: 0; }
.produto-nome { font-weight: 600; color: var(--text); font-size: 15px; }
.produto-dados { font-size: 13px; color: var(--text2); margin-top: 2px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-low { background: rgba(224,82,82,0.15); color: #ff6b6b; border: 1px solid rgba(224,82,82,0.3); }
.badge-ok { background: rgba(61,189,125,0.15); color: #3dbd7d; border: 1px solid rgba(61,189,125,0.3); }
.badge-marca { background: rgba(201,168,76,0.12); color: var(--gold); border: 1px solid rgba(201,168,76,0.25); }
.carrinho-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
.total { font-size: 22px; font-weight: 800; color: var(--success); }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; z-index: 1000; align-items: center; justify-content: center; }
.modal-box { background: var(--card); border: 1px solid var(--border); padding: 32px; border-radius: 18px; max-width: 480px; width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.6); }
.modal-box h2, .modal-box h3 { margin-bottom: 20px; color: var(--gold); }
.input-group { margin-bottom: 16px; }
label { display: block; margin-bottom: 6px; font-weight: 600; color: var(--text2); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; transition: border-color 0.2s; font-family: inherit; background: var(--card2); color: var(--text); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
input::placeholder { color: #555; }
select option { background: var(--card2); color: var(--text); }
.btn-primary { background: linear-gradient(135deg, var(--gold), var(--gold2)); color: #000; padding: 14px 28px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: all 0.2s; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(201,168,76,0.35); opacity: 0.92; }
.btn-secondary { background: var(--card2); color: var(--text2); border: 1px solid var(--border); padding: 11px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
.btn-secondary:hover { border-color: var(--text2); color: var(--text); }
.btn-success { background: rgba(61,189,125,0.15); color: var(--success); border: 1px solid rgba(61,189,125,0.3); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; white-space: nowrap; }
.btn-success:hover { background: var(--success); color: #000; border-color: var(--success); }
.btn-danger { background: rgba(224,82,82,0.15); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.btn-danger:hover { background: var(--danger); color: white; border-color: var(--danger); }
.btn-warning { background: rgba(232,168,56,0.15); color: var(--warning); border: 1px solid rgba(232,168,56,0.3); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
.btn-warning:hover { background: var(--warning); color: #000; border-color: var(--warning); }
.toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; background: #1e2e26; border: 1px solid var(--success); color: var(--success); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transform: translateX(450px); transition: transform 0.3s; z-index: 3000; font-weight: 500; max-width: 320px; }
.toast.show { transform: translateX(0); }
.toast.error { background: #2e1e1e; border-color: var(--danger); color: var(--danger); }
.busca-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 50px; font-size: 15px; margin-bottom: 16px; transition: border-color 0.2s; background: var(--card2); color: var(--text); }
.busca-input:focus { outline: none; border-color: var(--gold); }
.busca-input::placeholder { color: #555; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filtro-btn { padding: 6px 14px; border: 1px solid var(--border); background: var(--card2); color: var(--text2); border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
.filtro-btn:hover, .filtro-btn.ativo { background: var(--gold); color: #000; border-color: var(--gold); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: var(--card2); padding: 10px 14px; text-align: left; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:hover td { background: var(--card2); }
.perfil-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.perfil-gestor { background: rgba(201,168,76,0.15); color: var(--gold); border: 1px solid rgba(201,168,76,0.3); }
.perfil-func { background: rgba(61,189,125,0.1); color: var(--success); border: 1px solid rgba(61,189,125,0.2); }
.alerta-box { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.2); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.progress-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.relatorio-card { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 10px; }
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #ffffff; border: none; padding: 45px; border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.15); width: 100%; max-width: 400px; }
.login-logo { text-align: center; margin-bottom: 30px; }
.login-logo h1 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #1e40af, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.login-logo p { color: #64748b; margin-top: 6px; font-size: 14px; }
.divider { height: 1px; background: #e2e8f0; margin: 20px 0; }
#modal-login input {
  background: #f8fafc;
  color: #1e293b;
  border: 1.5px solid #cbd5e1;
}
#modal-login input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
#modal-login input::placeholder { color: #94a3b8; }
#modal-login .btn-primary {
  background: linear-gradient(135deg, #1e40af, #3b82f6);
  color: white;
}
#modal-login .btn-primary:hover {
  box-shadow: 0 8px 20px rgba(59,130,246,0.4);
}
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
  header { flex-direction: column; text-align: center; }
  .btn-nav { padding: 8px 14px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- Modal Login -->
<div id="modal-login" class="modal-overlay" style="display:flex;background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#374151 100%)">
  <div class="modal-box">
    <div class="login-logo">
      <h1>📦 StandardBox</h1>
      <p>Controle e gestão<</p>
    </div>
    <div class="input-group">
      <label>Usuário</label>
      <input id="login-user" type="text" placeholder="Digite seu usuário" autocomplete="username">
    </div>
    <div class="input-group">
      <label>Senha</label>
      <input id="login-pass" type="password" placeholder="Digite sua senha" autocomplete="current-password">
    </div>
    <button class="btn-primary" onclick="fazerLogin()">Entrar no sistema</button>
    <div class="divider"></div>
    <p style="text-align:center;font-size:12px;color:var(--text2)">Para se cadastrar, faça contato com o administrador</p>
  </div>
</div>

<!-- Modal Movimentação Estoque -->
<div id="modal-estoque" class="modal-overlay">
  <div id="modal-estoque-content" class="modal-box"></div>
</div>

<!-- Modal Produto (Cadastro/Edição) -->
<div id="modal-produto" class="modal-overlay">
  <div id="modal-produto-content" class="modal-box"></div>
</div>

<!-- App -->
<div id="app"></div>

<!-- CDNs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE =====
try {
  firebase.initializeApp({
    apiKey: "AIzaSyDxtBgdg9dPArhRiT3pQZ2n0VYMwlZexQI",
    authDomain: "standardbox-ccb40.firebaseapp.com",
    projectId: "standardbox-ccb40",
    storageBucket: "standardbox-ccb40.firebasestorage.app",
    messagingSenderId: "753178487994",
    appId: "1:753178487994:web:4a75eb98a819f0f1efe683"
  });
  window._fbDB = firebase.firestore();
  window._fbSalvar = d => window._fbDB.collection('standardbox').doc('dados').set(d).catch(e => console.log('Firebase erro:', e));
  window._fbCarregar = () => window._fbDB.collection('standardbox').doc('dados').get().then(s => s.exists ? s.data() : null).catch(() => null);
  console.log('✅ Firebase conectado!');
} catch(e) {
  window._fbSalvar = () => Promise.resolve();
  window._fbCarregar = () => Promise.resolve(null);
}

// ===== BANCO DE DADOS COMPLETO — 78 PRODUTOS =====
const DB_INICIAL = {
  config: {
    nomeLoja: 'STANDARD',
    versao: '2.0',
    dataInicio: new Date().toISOString().split('T')[0]
  },
  usuarios: [
    {id:1,nome:'Bruno Duarte',usuario:'bruno',senha:'bruno1234bearon',perfil:'gestor',ativo:true,limiteDesconto:100},
    {id:2,nome:'Talles',usuario:'talles',senha:'talles1234bearon',perfil:'gestor',ativo:true,limiteDesconto:100}
  ],
  produtos: [
   
  ],
  vendas: [],
  caixa: { dia: new Date().toISOString().split('T')[0], entradas: 0, saidas: 0 },
  logs: [],
  proximoId: { produto: 0, venda: 0, usuario: 2 }
};

// ===== ESTADO =====
let DB = JSON.parse(JSON.stringify(DB_INICIAL));
let usuarioLogado = null;
let estado = {
  tela: 'login',
  carrinho: [],
  busca: '',
  filtroMarca: 'Todas',
  filtroCategoria: 'Todas'
};

window.DB = DB;

// ===== PERSISTÊNCIA =====
function salvar() { salvarCompleto(); } // alias de compatibilidade

function carregar() {
  _fbCarregar().then(data => {
    if (data) {
      // Carrega vendas, caixa, logs e produtos do Firebase (dados operacionais)
      if (data.vendas)   DB.vendas   = data.vendas;
      if (data.caixa)    DB.caixa    = data.caixa;
      if (data.logs)     DB.logs     = data.logs;
      if (data.proximoId) DB.proximoId = data.proximoId;
      // Produtos: usa os do Firebase se tiver, senão mantém os do DB_INICIAL
      if (data.produtos && data.produtos.length > 0) DB.produtos = data.produtos;
      // NUNCA sobrescreve usuários — sempre usa os do DB_INICIAL com senhas corretas
      // (usuários criados pelo gestor são salvos separado abaixo)
      if (data.usuariosExtras && data.usuariosExtras.length > 0) {
        // Adiciona apenas usuários criados pelo gestor (não os padrão)
        const idsBase = [1, 2, 3, 4, 5];
        data.usuariosExtras.forEach(u => {
          if (!idsBase.includes(u.id) && !DB.usuarios.find(x => x.id === u.id)) {
            DB.usuarios.push(u);
          }
        });
      }
      console.log('✅ Firebase carregado:', DB.produtos.length, 'produtos,', DB.vendas.length, 'vendas');
    } else {
      console.log('✅ Primeira execução — dados iniciais carregados');
    }
    if (usuarioLogado) render();
  });
}

function salvarCompleto() {
  // Salva tudo EXCETO os 3 usuários base (salva só os extras criados pelo gestor)
  const extras = DB.usuarios.filter(u => u.id > 3);
  _fbSalvar({
    vendas:        DB.vendas,
    caixa:         DB.caixa,
    logs:          DB.logs,
    produtos:      DB.produtos,
    proximoId:     DB.proximoId,
    usuariosExtras: extras
  });
}

// ===== UTILITÁRIOS =====
function fmtMoeda(v) {
  return 'R$ ' + parseFloat(v || 0).toFixed(2).replace('.', ',');
}

function showToast(msg, tipo = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${tipo === 'error' ? 'error' : ''}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 50);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3500);
}

function adicionarLog(acao, detalhes = {}) {
  if (!usuarioLogado) return;
  DB.logs.unshift({
    id: Date.now(),
    timestamp: new Date().toISOString(),
    usuario: usuarioLogado.nome,
    acao,
    detalhes
  });
  if (DB.logs.length > 500) DB.logs = DB.logs.slice(0, 500);
}

// ===== NORMALIZAR SENHAS (garante formato correto após carregar do Firebase) =====
function normalizarSenhas() {
  // Senhas fixas dos usuários padrão — sempre mantém sincronizado
  const senhasPadrao = {
    
    'bruno':  'bruno1234bearon',
    'talles': 'talles1234bearon'
  };
  DB.usuarios.forEach(u => {
    if (senhasPadrao[u.usuario]) {
      u.senha = senhasPadrao[u.usuario];
    }
  });
}

// ===== LOGIN / LOGOUT =====
function fazerLogin() {
  const user = document.getElementById('login-user').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;

  // Suporta tanto o hash novo (usuario+senha+bearon) quanto a senha direta (compatibilidade)
  const senhaHash = user + pass + 'bearon';
  const usuario = DB.usuarios.find(u =>
    u.usuario === user &&
    (u.senha === senhaHash || u.senha === pass || u.senha === (pass + 'ccb40bearon2026').slice(0,60)) &&
    u.ativo
  );

  if (usuario) {
    usuarioLogado = usuario;
    
    estado.tela = 'dashboard';
    document.getElementById('modal-login').style.display = 'none';
    render();
    showToast(`Bem-vindo(a), ${usuario.nome}!`);
    adicionarLog('LOGIN');
    salvarCompleto();
  } else {
    showToast('Usuário ou senha inválidos', 'error');
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

function logout() {
  adicionarLog('LOGOUT');
  salvarCompleto();
  
  usuarioLogado = null;
  estado = { tela: 'login', carrinho: [], busca: '', filtroMarca: 'Todas', filtroCategoria: 'Todas' };
  const ml = document.getElementById('modal-login');
  ml.style.display = 'flex';
  ml.style.background = 'linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#374151 100%)';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('app').innerHTML = '';
  showToast('Até logo!');
}

function verificarSessao() {
  if (usuarioLogado) return true;
  const saved = null; // sessionStorage removido
  if (saved) {
    try {
      const u = JSON.parse(saved);
      usuarioLogado = DB.usuarios.find(x => x.id === u.id && x.ativo);
      return !!usuarioLogado;
    } catch(e) { return false; }
  }
  return false;
}

// ===== RENDER PRINCIPAL =====
function render() {
  if (!verificarSessao()) {
    document.getElementById('modal-login').style.display = 'flex';
    document.getElementById('app').innerHTML = '';
    return;
  }
  document.getElementById('modal-login').style.display = 'none';

  const app = document.getElementById('app');
  const telas = { dashboard: renderDashboard, catalogo: renderCatalogo, vendas: renderVendas, relatorios: renderRelatorios, usuarios: renderUsuarios };
  const fn = telas[estado.tela];
  if (fn) app.innerHTML = fn();
  else app.innerHTML = renderDashboard();
}

// ===== NAVBAR =====
function navBar(telaAtual) {
  const isGestor = usuarioLogado.perfil === 'gestor';
  return `
    <header>
      <div class="logo">📦 StandardBox</div>
      <nav>
        <button class="btn-nav ${telaAtual==='dashboard'?'active':''}" onclick="irPara('dashboard')">🏠 Dashboard</button>
        <button class="btn-nav ${telaAtual==='catalogo'?'active':''}" onclick="irPara('catalogo')">📋 Catálogo</button>
        <button class="btn-nav ${telaAtual==='vendas'?'active':''}" onclick="irPara('vendas')">💰 Venda</button>
        ${isGestor ? `<button class="btn-nav ${telaAtual==='relatorios'?'active':''}" onclick="irPara('relatorios')">📊 Relatórios</button>` : ''}
        ${isGestor ? `<button class="btn-nav ${telaAtual==='usuarios'?'active':''}" onclick="irPara('usuarios')">👥 Usuários</button>` : ''}
        <button class="btn-nav" onclick="exportExcel()" title="Exportar Excel">📊</button>
        <button class="btn-nav" onclick="exportPDF()" title="Exportar PDF">📄</button>
        <button class="btn-nav" style="background:#ef4444" onclick="logout()">🚪 Sair</button>
      </nav>
    </header>`;
}

function irPara(tela) {
  estado.tela = tela;
  render();
}

// ===== DASHBOARD =====
function renderDashboard() {
  const isGestor = usuarioLogado.perfil === 'gestor';
  const prodBaixos = DB.produtos.filter(p => p.estoqueAtual < p.estoqueMin);
  const totalEstoque = DB.produtos.reduce((s, p) => s + (p.estoqueAtual * p.precoVenda), 0);
  const vendasHoje = DB.vendas.filter(v => v.data.startsWith(new Date().toISOString().split('T')[0]));
  const faturamentoHoje = vendasHoje.reduce((s, v) => s + v.totalFinal, 0);
  const itensCarrinho = estado.carrinho.reduce((s, i) => s + i.qtd, 0);

  let alertasHTML = '';
  if (prodBaixos.length > 0) {
    alertasHTML = `
      <div class="card">
        <h3>⚠️ Estoque Crítico (${prodBaixos.length})</h3>
        ${prodBaixos.slice(0,8).map(p => `
          <div class="alerta-box">
            <div>
              <strong>${p.nome}</strong>
              <div style="font-size:13px;color:var(--text2)">${p.marca}</div>

              <span style="font-weight:800;font-size:18px;color:var(--success)">${fmtMoeda(total)}</span>
            </div>
            <div class="input-group">
              <label>Desconto % (máx. ${limite}%)</label>
              <input id="desconto-venda" type="number" min="0" max="${limite}" value="0" onchange="calcDesconto()">
            </div>
            <div id="valor-desconto" style="text-align:right;font-size:13px;color:var(--text2);margin:-12px 0 12px"></div>
            <div class="input-group">
              <label>Forma de Pagamento</label>
              <select id="forma-pgto">

function renderListaVenda(busca = '') {
  const div = document.getElementById('lista-venda');
  if (!div) return;
  const lista = DB.produtos.filter(p =>
    (!busca || p.nome.toLowerCase().includes(busca.toLowerCase()) || p.codigo.toLowerCase().includes(busca.toLowerCase())) &&
    p.estoqueAtual > 0
  ).slice(0, 30);

  div.innerHTML = lista.length === 0 ? '<p style="text-align:center;color:var(--text2);padding:20px">Nenhum produto com estoque disponível</p>' :
    lista.map(p => `
      <div class="produto-item" style="cursor:pointer" onclick="adicionarCarrinho('${p.codigo}')">
        <div class="produto-info">
          <div class="produto-nome">${p.nome} <span class="badge badge-marca">${p.marca}</span></div>
          <div class="produto-dados">${fmtMoeda(p.precoVenda)} | Estoque: ${p.estoqueAtual} ${p.unidade||'und'}</div>
        </div>
        <button class="btn-success">+ Adicionar</button>
      </div>`).join('');
}

function calcDesconto() {
  const input = document.getElementById('desconto-venda');
  const div = document.getElementById('valor-desconto');
  if (!input || !div) return;
  const desc = parseFloat(input.value) || 0;
  const total = estado.carrinho.reduce((s, i) => s + i.qtd * i.precoVenda, 0);
  const limite = usuarioLogado?.limiteDesconto || 0;
  if (desc > limite) { input.value = limite; }
  const valDesc = total * (Math.min(desc, limite) / 100);
  const valFinal = total - valDesc;
  div.innerHTML = valDesc > 0 ? `Desconto: -${fmtMoeda(valDesc)} → Total: <strong style="color:var(--success)">${fmtMoeda(valFinal)}</strong>` : '';
}

function ajustarQtd(index, delta) {
  const item = estado.carrinho[index];
  if (!item) return;
  const prod = DB.produtos.find(p => p.codigo === item.codigo);
  const novaQtd = item.qtd + delta;
  if (novaQtd <= 0) { estado.carrinho.splice(index, 1); }
  else if (prod && novaQtd > prod.estoqueAtual) { showToast('Quantidade excede o estoque!', 'error'); return; }
  else { item.qtd = novaQtd; }
  render();
  setTimeout(() => renderListaVenda(document.getElementById('busca-venda')?.value || ''), 50);
}

function removerDoCarrinho(index) {
  estado.carrinho.splice(index, 1);
  render();
  setTimeout(() => renderListaVenda(document.getElementById('busca-venda')?.value || ''), 50);
}

function adicionarCarrinho(codigo) {
  const prod = DB.produtos.find(p => p.codigo === codigo);
  if (!prod) return showToast('Produto não encontrado', 'error');
  if (prod.estoqueAtual <= 0) return showToast('Sem estoque disponível!', 'error');

  const item = estado.carrinho.find(i => i.codigo === codigo);
  if (item) {
    const prod2 = DB.produtos.find(p => p.codigo === codigo);
    if (item.qtd >= prod2.estoqueAtual) return showToast('Quantidade máxima atingida!', 'error');
    item.qtd++;
  } else {
    estado.carrinho.push({ ...prod, qtd: 1 });
  }

  if (estado.tela !== 'vendas') {
    showToast(`${prod.nome} adicionado ao carrinho!`);
    adicionarLog('CARRINHO_ADD', { codigo, nome: prod.nome });
  } else {
    render();
    setTimeout(() => renderListaVenda(document.getElementById('busca-venda')?.value || ''), 50);
  }
}

function finalizarVenda() {
  if (!estado.carrinho.length) return showToast('Carrinho vazio!', 'error');

  const total = estado.carrinho.reduce((s, i) => s + i.qtd * i.precoVenda, 0);
  const descontoInput = document.getElementById('desconto-venda');
  const desconto = Math.min(parseFloat(descontoInput?.value || 0), usuarioLogado?.limiteDesconto || 0);
  const formaPgto = document.getElementById('forma-pgto')?.value || 'Dinheiro';
  const totalFinal = total * (1 - desconto / 100);

  // Verifica estoque
  for (const item of estado.carrinho) {
    const prod = DB.produtos.find(p => p.codigo === item.codigo);
    if (!prod || prod.estoqueAtual < item.qtd) {
      return showToast(`Estoque insuficiente: ${item.nome}`, 'error');
    }
  }

  const venda = {
    id: DB.proximoId.venda++,
    data: new Date().toISOString(),
    usuario: usuarioLogado.nome,
    usuarioId: usuarioLogado.id,
    itens: estado.carrinho.map(i => ({ codigo: i.codigo, nome: i.nome, qtd: i.qtd, precoUnit: i.precoVenda, total: i.qtd * i.precoVenda })),
    totalOriginal: total,
    desconto,
    totalFinal,
    formaPagamento: formaPgto
  };

  // Baixar estoque
  estado.carrinho.forEach(item => {
    const prod = DB.produtos.find(p => p.codigo === item.codigo);
    if (prod) prod.estoqueAtual -= item.qtd;
  });

  DB.vendas.push(venda);
  DB.caixa.entradas += totalFinal;

  adicionarLog('VENDA', { id: venda.id, total: totalFinal, desconto, itens: venda.itens.length, forma: formaPgto });
  salvarCompleto();

  estado.carrinho = [];
  estado.tela = 'dashboard';
  render();
  showToast(`Venda #${venda.id} — ${fmtMoeda(totalFinal)} via ${formaPgto}`);
}

function abrirMovEstoque(codigo) {
  const prod = DB.produtos.find(p => p.codigo === codigo);
  if (!prod) return;

  document.getElementById('modal-estoque-content').innerHTML = `
    <h3>📦 Movimentação de Estoque</h3>
    <p style="color:var(--text2);margin-bottom:20px">${prod.nome} — <strong>${prod.marca}</strong></p>
    <div style="background:var(--card2);border-radius:12px;padding:14px;margin-bottom:20px;display:flex;gap:20px">
      <div><div style="font-size:12px;color:var(--text2)">ATUAL</div><div style="font-size:24px;font-weight:800;color:var(--gold)">${prod.estoqueAtual}</div></div>
      <div><div style="font-size:12px;color:var(--text2)">MÍNIMO</div><div style="font-size:24px;font-weight:800;color:var(--warning)">${prod.estoqueMin}</div></div>
      <div><div style="font-size:12px;color:var(--text2)">UNIDADE</div><div style="font-size:24px;font-weight:800;color:var(--text)">${prod.unidade}</div></div>
    </div>
    <div class="input-group">
      <label>Tipo de Movimentação</label>
      <select id="mov-tipo">
        <option value="entrada">➕ Entrada (compra/recebimento)</option>
        <option value="saida">➖ Saída (avaria/uso/descarte)</option>
      </select>
    </div>
    <div class="input-group">
      <label>Quantidade</label>
      <input id="mov-qtd" type="number" min="1" value="1">
    </div>
    <div class="input-group">
      <label>Motivo / Observação</label>
      <input id="mov-motivo" placeholder="Ex: Compra do fornecedor, produto vencido...">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn-primary" style="flex:1" onclick="confirmarMovEstoque('${codigo}')">✅ Confirmar</button>
      <button class="btn-secondary" style="flex:1" onclick="fecharModal('modal-estoque')">Cancelar</button>
    </div>`;

  document.getElementById('modal-estoque').style.display = 'flex';
}

function confirmarMovEstoque(codigo) {
  const tipo = document.getElementById('mov-tipo').value;
  const qtd = parseInt(document.getElementById('mov-qtd').value);
  const motivo = document.getElementById('mov-motivo').value || 'Sem motivo informado';

  if (!qtd || qtd <= 0) return showToast('Informe uma quantidade válida', 'error');

  const prod = DB.produtos.find(p => p.codigo === codigo);
  if (!prod) return;

  if (tipo === 'saida' && prod.estoqueAtual < qtd) {
    return showToast(`Estoque insuficiente! Disponível: ${prod.estoqueAtual}`, 'error');
  }

  prod.estoqueAtual += tipo === 'entrada' ? qtd : -qtd;

  adicionarLog('MOV_ESTOQUE', { codigo, nome: prod.nome, tipo, qtd, motivo, novoEstoque: prod.estoqueAtual });
  salvarCompleto();
  fecharModal('modal-estoque');
  render();
  showToast(`${tipo === 'entrada' ? '➕ Entrada' : '➖ Saída'}: ${qtd} ${prod.unidade} | Novo estoque: ${prod.estoqueAtual}`);
}

    </div>
    <div class="input-group"><label>Descrição</label><input id="prd-desc" value="${prod?.descricao||''}" placeholder="Descrição breve do produto"></div>
    <div class="input-group"><label>Benefícios</label><input id="prd-benef" value="${prod?.beneficios||''}" placeholder="Ex: Ganho muscular, recuperação"></div>
    <div class="input-group"><label>Observações de Uso</label><input id="prd-obs" value="${prod?.observacoes||''}" placeholder="Ex: 1 dose pós-treino"></div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn-primary" style="flex:1" onclick="salvarProduto('${codigo||''}')">💾 Salvar</button>
      <button class="btn-secondary" style="flex:1" onclick="fecharModal('modal-produto')">Cancelar</button>
    </div>`;

  document.getElementById('modal-produto').style.display = 'flex';
}

function salvarProduto(codigoExistente) {
  const nome = document.getElementById('prd-nome').value.trim();
  if (!nome) return showToast('Nome do produto é obrigatório', 'error');

  const dados = {
    nome,
    marca: document.getElementById('prd-marca').value,
    categoria: document.getElementById('prd-cat').value,
    precoCusto: parseFloat(document.getElementById('prd-custo').value) || 0,
    precoVenda: parseFloat(document.getElementById('prd-venda').value) || 0,
    unidade: document.getElementById('prd-un').value,
    estoqueAtual: parseInt(document.getElementById('prd-estq').value) || 0,
    estoqueMin: parseInt(document.getElementById('prd-min').value) || 5,
    descricao: document.getElementById('prd-desc').value,
    beneficios: document.getElementById('prd-benef').value,
    observacoes: document.getElementById('prd-obs').value
  };

  if (codigoExistente) {
    const idx = DB.produtos.findIndex(p => p.codigo === codigoExistente);
    if (idx >= 0) { DB.produtos[idx] = { ...DB.produtos[idx], ...dados }; }
    showToast('Produto atualizado com sucesso!');
    adicionarLog('PRODUTO_EDIT', { codigo: codigoExistente, nome });
  } else {
    const novoCodigo = 'P' + String(DB.proximoId.produto++).padStart(3, '0');
    DB.produtos.push({ codigo: novoCodigo, ...dados });
    showToast(`Produto cadastrado! Código: ${novoCodigo}`);
    adicionarLog('PRODUTO_NOVO', { codigo: novoCodigo, nome });
  }

  salvarCompleto();
  fecharModal('modal-produto');
  render();
}

function removerProduto(codigo) {
  if (usuarioLogado.perfil !== 'gestor') return showToast('Apenas gestores podem remover produtos', 'error');
  const prod = DB.produtos.find(p => p.codigo === codigo);
  if (!prod) return;
  if (!confirm(`Remover "${prod.nome}" do catálogo? Essa ação não pode ser desfeita.`)) return;
  DB.produtos = DB.produtos.filter(p => p.codigo !== codigo);
  adicionarLog('PRODUTO_REMOVIDO', { codigo, nome: prod.nome });
  salvarCompleto();
  render();
  showToast(`${prod.nome} removido do catálogo`);
}

function fecharModal(id) {
  document.getElementById(id).style.display = 'none';
}

// ===== RELATÓRIOS =====
function renderRelatorios() {
  if (usuarioLogado.perfil !== 'gestor') return '<div class="card"><h3>Acesso restrito</h3></div>';

  const vendasPorForma = {};
  const vendasPorUsuario = {};
  let totalVendido = 0, totalDesconto = 0;

  DB.vendas.forEach(v => {
    totalVendido += v.totalFinal;
    totalDesconto += v.totalOriginal - v.totalFinal;
    vendasPorForma[v.formaPagamento] = (vendasPorForma[v.formaPagamento] || 0) + v.totalFinal;
    vendasPorUsuario[v.usuario] = (vendasPorUsuario[v.usuario] || { qtd: 0, total: 0 });
    vendasPorUsuario[v.usuario].qtd++;
    vendasPorUsuario[v.usuario].total += v.totalFinal;
  });

  // Produtos com baixo giro
  const prodVendidos = {};
  DB.vendas.forEach(v => v.itens.forEach(i => {
    prodVendidos[i.codigo] = (prodVendidos[i.codigo] || 0) + i.qtd;
  }));
  const baixoGiro = DB.produtos
    .filter(p => (prodVendidos[p.codigo] || 0) < 3 && p.estoqueAtual > (p.estoqueMin * 2))
    .sort((a, b) => (prodVendidos[a.codigo]||0) - (prodVendidos[b.codigo]||0))
    .slice(0, 10);

  // Rentabilidade
  const rentabilidade = DB.produtos
    .filter(p => p.precoCusto > 0)
    .map(p => ({ ...p, margem: ((p.precoVenda - p.precoCusto) / p.precoCusto * 100).toFixed(1) }))
    .sort((a, b) => b.margem - a.margem);

  return `
    ${navBar('relatorios')}
    <div class="grid">
      <div class="card">
        <h3>💰 Resumo Financeiro</h3>
        <div class="relatorio-card"><div style="font-size:13px;color:var(--text2)">TOTAL FATURADO</div><div style="font-size:28px;font-weight:800;color:var(--success)">${fmtMoeda(totalVendido)}</div></div>
        <div class="relatorio-card"><div style="font-size:13px;color:var(--text2)">TOTAL VENDAS</div><div style="font-size:28px;font-weight:800;color:var(--gold)">${DB.vendas.length}</div></div>
        <div class="relatorio-card"><div style="font-size:13px;color:var(--text2)">TOTAL DESCONTOS</div><div style="font-size:28px;font-weight:800;color:var(--warning)">${fmtMoeda(totalDesconto)}</div></div>
      </div>
      <div class="card">
        <h3>💳 Formas de Pagamento</h3>
        ${Object.entries(vendasPorForma).length === 0 ? '<p style="color:var(--text2)">Nenhuma venda registrada.</p>' :
          Object.entries(vendasPorForma).sort((a,b)=>b[1]-a[1]).map(([forma, val]) => `
            <div class="relatorio-card" style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:600">${forma}</span>
              <span style="font-weight:800;color:var(--gold)">${fmtMoeda(val)}</span>
            </div>`).join('')}
      </div>
      <div class="card">
        <h3>👥 Desempenho por Funcionário</h3>
        ${Object.entries(vendasPorUsuario).length === 0 ? '<p style="color:var(--text2)">Nenhuma venda registrada.</p>' :
          Object.entries(vendasPorUsuario).sort((a,b)=>b[1].total-a[1].total).map(([user, dados]) => `
            <div class="relatorio-card" style="display:flex;justify-content:space-between;align-items:center">
              <div><div style="font-weight:600">${user}</div><div style="font-size:12px;color:var(--text2)">${dados.qtd} venda(s)</div></div>
              <span style="font-weight:800;color:var(--success)">${fmtMoeda(dados.total)}</span>
            </div>`).join('')}
      </div>
      <div class="card">
        <h3>⚠️ Baixo Giro (Candidatos ao Descarte)</h3>
        ${baixoGiro.length === 0 ? '<p style="color:var(--text2)">Todos os produtos têm giro adequado.</p>' :
          baixoGiro.map(p => `
            <div class="alerta-box">
              <div>
                <div style="font-weight:600;font-size:14px">${p.nome}</div>
                <div style="font-size:12px;color:var(--text2)">${p.marca} | Estoque: ${p.estoqueAtual}</div>
              </div>
              <span class="badge badge-low">${prodVendidos[p.codigo]||0} vendas</span>
            </div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <h3>📈 Rentabilidade por Produto</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Produto</th><th>Marca</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Estoque</th></tr></thead>
          <tbody>
            ${rentabilidade.slice(0,20).map(p => `
              <tr>
                <td style="font-weight:500">${p.nome}</td>
                <td><span class="badge badge-marca">${p.marca}</span></td>
                <td>${fmtMoeda(p.precoCusto)}</td>
                <td>${fmtMoeda(p.precoVenda)}</td>
                <td><span class="badge ${parseFloat(p.margem)>40?'badge-ok':parseFloat(p.margem)>20?'':' badge-low'}" style="${parseFloat(p.margem)>20&&parseFloat(p.margem)<=40?'background:#fef3c7;color:#92400e':''}">${p.margem}%</span></td>
                <td>${p.estoqueAtual} ${p.unidade||'und'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card" style="margin-top:20px">
      <h3>🧾 Últimas Vendas</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Data</th><th>Funcionário</th><th>Itens</th><th>Desc.</th><th>Total</th><th>Pagamento</th></tr></thead>
          <tbody>
            ${DB.vendas.slice().reverse().slice(0,20).map(v => `
              <tr>
                <td>${v.id}</td>
                <td style="white-space:nowrap">${new Date(v.data).toLocaleString('pt-BR')}</td>
                <td>${v.usuario}</td>
                <td>${v.itens.length} item(ns)</td>
                <td>${v.desconto > 0 ? v.desconto+'%' : '—'}</td>
                <td style="font-weight:700;color:var(--success)">${fmtMoeda(v.totalFinal)}</td>
                <td>${v.formaPagamento}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

// ===== USUÁRIOS =====
function renderUsuarios() {
  if (usuarioLogado.perfil !== 'gestor') return '<div class="card"><h3>Acesso restrito</h3></div>';

  return `
    ${navBar('usuarios')}
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 style="margin:0">👥 Gerenciar Usuários</h3>
        <button class="btn-success" onclick="abrirModalUsuario()">➕ Novo Usuário</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Limite Desconto</th><th>Status</th><th>Ações</th></tr></thead>
          <tbody>
            ${DB.usuarios.map(u => `
              <tr>
                <td style="font-weight:600">${u.nome}</td>
                <td>${u.usuario}</td>
                <td><span class="perfil-badge ${u.perfil==='gestor'?'perfil-gestor':'perfil-func'}">${u.perfil === 'gestor' ? '🔑 Gestor' : '👷 Funcionário'}</span></td>
                <td>${u.limiteDesconto}%</td>
                <td><span class="badge ${u.ativo?'badge-ok':'badge-low'}">${u.ativo?'Ativo':'Inativo'}</span></td>
                <td>
                  <button class="btn-warning" onclick="abrirModalUsuario(${u.id})" style="padding:5px 10px;font-size:12px">✏️ Editar</button>
                  ${u.id !== usuarioLogado.id ? `<button class="btn-${u.ativo?'danger':'success'}" onclick="toggleUsuario(${u.id})" style="padding:5px 10px;font-size:12px;margin-left:4px">${u.ativo?'Desativar':'Ativar'}</button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function abrirModalUsuario(id = null) {
  const u = id ? DB.usuarios.find(x => x.id === id) : null;
  document.getElementById('modal-produto-content').innerHTML = `
    <h3>${u ? '✏️ Editar Usuário' : '➕ Novo Usuário'}</h3>
    <div class="input-group"><label>Nome Completo</label><input id="usr-nome" value="${u?.nome||''}" placeholder="Ex: Carlos Vendedor"></div>
    <div class="input-group"><label>Login (usuário)</label><input id="usr-login" value="${u?.usuario||''}" placeholder="Ex: carlos"></div>
    <div class="input-group"><label>Senha ${u?'(deixe em branco para manter)':''}</label><input id="usr-senha" type="password" placeholder="Nova senha"></div>
    <div class="input-group"><label>Perfil</label>
      <select id="usr-perfil">
        <option value="funcionario" ${u?.perfil==='funcionario'?'selected':''}>👷 Funcionário</option>
        <option value="gestor" ${u?.perfil==='gestor'?'selected':''}>🔑 Gestor</option>
      </select>
    </div>
    <div class="input-group"><label>Limite de Desconto %</label><input id="usr-desc" type="number" min="0" max="100" value="${u?.limiteDesconto||10}"></div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn-primary" style="flex:1" onclick="salvarUsuario(${id||'null'})">💾 Salvar</button>
      <button class="btn-secondary" style="flex:1" onclick="fecharModal('modal-produto')">Cancelar</button>
    </div>`;
  document.getElementById('modal-produto').style.display = 'flex';
}

function salvarUsuario(id) {
  const nome = document.getElementById('usr-nome').value.trim();
  const login = document.getElementById('usr-login').value.trim().toLowerCase();
  const senha = document.getElementById('usr-senha').value;
  const perfil = document.getElementById('usr-perfil').value;
  const limiteDesconto = parseInt(document.getElementById('usr-desc').value) || 0;

  if (!nome || !login) return showToast('Nome e login são obrigatórios', 'error');

  if (id && id !== 'null') {
    const u = DB.usuarios.find(x => x.id === id);
    if (!u) return;
    u.nome = nome;
    u.perfil = perfil;
    u.limiteDesconto = limiteDesconto;
    if (senha) u.senha = login + senha + 'bearon';
    showToast('Usuário atualizado!');
  } else {
    if (DB.usuarios.find(u => u.usuario === login)) return showToast('Login já existe!', 'error');
    if (!senha) return showToast('Senha obrigatória para novo usuário', 'error');
    const novoId = Math.max(...DB.usuarios.map(u => u.id)) + 1;
    DB.usuarios.push({ id: novoId, nome, usuario: login, senha: login + senha + 'bearon', perfil, ativo: true, limiteDesconto });
    showToast(`Usuário ${nome} criado!`);
  }

  salvarCompleto();
  fecharModal('modal-produto');
  render();
}

function toggleUsuario(id) {
  const u = DB.usuarios.find(x => x.id === id);
  if (!u) return;
  u.ativo = !u.ativo;
  adicionarLog('USUARIO_TOGGLE', { id, nome: u.nome, ativo: u.ativo });
  salvarCompleto();
  render();
  showToast(`${u.nome}: ${u.ativo ? 'ativado' : 'desativado'}`);
}

// ===== EXPORTAÇÕES =====
function exportPDF() {
  const conteudo = document.getElementById('app');
  if (!conteudo) return;
  html2pdf().set({
    margin: 0.5,
    filename: `StandardBox-Bearon-${new Date().toISOString().split('T')[0]}.pdf`,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true, logging: false },
    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
  }).from(conteudo).save();
  showToast('PDF exportado!');
  adicionarLog('EXPORT_PDF');
}

function exportExcel() {
  const wb = XLSX.utils.book_new();

  // Aba Produtos
  const prodData = DB.produtos.map(p => ({
    Codigo: p.codigo, Produto: p.nome, Marca: p.marca, Categoria: p.categoria,
    'Estoque Atual': p.estoqueAtual, 'Estoque Mínimo': p.estoqueMin, Unidade: p.unidade,
    'Preço Custo': p.precoCusto, 'Preço Venda': p.precoVenda,
    'Margem %': p.precoCusto > 0 ? ((p.precoVenda-p.precoCusto)/p.precoCusto*100).toFixed(1) : 0,
    Descrição: p.descricao || '', Benefícios: p.beneficios || ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodData), 'Estoque');

  // Aba Vendas
  if (DB.vendas.length > 0) {
    const vendasData = DB.vendas.map(v => ({
      ID: v.id, Data: new Date(v.data).toLocaleString('pt-BR'),
      Funcionário: v.usuario, Itens: v.itens.length,
      'Total Original': v.totalOriginal, 'Desconto %': v.desconto,
      'Total Final': v.totalFinal, Pagamento: v.formaPagamento
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(vendasData), 'Vendas');
  }

  XLSX.writeFile(wb, `StandardBox-Bearon-${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Excel exportado com sucesso!');
  adicionarLog('EXPORT_EXCEL');
}

// ===== INICIALIZAÇÃO =====
normalizarSenhas(); // garante senhas corretas antes do Firebase carregar
carregar();

document.addEventListener('DOMContentLoaded', () => {
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('modal-login').style.display !== 'none') fazerLogin();
    }
    if (e.key === 'Escape') {
      fecharModal('modal-estoque');
      fecharModal('modal-produto');
    }
  });

  // Verificar sessão salva
  if (verificarSessao()) {
    estado.tela = 'dashboard';
    render();
  }

  console.log('🚀 StandardBox Controle e gestão');
  console.log('✅ Total de produtos:', DB.produtos.length);
});

// Re-renderizar lista de vendas após render
const _render_orig = render;
window.render = function() {
  _render_orig();
  if (estado.tela === 'vendas') {
    setTimeout(() => renderListaVenda(document.getElementById('busca-venda')?.value || ''), 50);
  }
};
</script>
</body>
